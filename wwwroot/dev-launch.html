<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Dev Launcher</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 20px auto;
        }

        code {
            background: #f3f3f3;
            padding: 2px 6px;
        }

        .ok {
            color: green;
        }

        .bad {
            color: crimson;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Dev Launcher</h2>
    <p>Click the button to open pages.</p>
    <button id="openBtn">Open Dev Tabs</button>
    <ul id="status"></ul>

    <script>
        const links = [
            "/OnlineCourseManagementViewer.html",
            "/swagger/index.html",
            "/HomePage.html"
            
        ];

        const ul = document.getElementById("status");
        const button = document.getElementById("openBtn");

        function addLine(text, ok) {
            const li = document.createElement("li");
            li.className = ok ? "ok" : "bad";
            li.textContent = text;
            ul.appendChild(li);
        }

        button.addEventListener("click", () => {
            ul.innerHTML = "";

            for (const url of links) {
                const w = window.open(url, "_blank");
                addLine(`open(${url}) -> ` + (w ? "opened" : "BLOCKED"), !!w);
            }
        });
    </script>
</body>
</html>
